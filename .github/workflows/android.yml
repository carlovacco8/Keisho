name: Android

# Builds the Android / Android TV APK (arm64-v8a): the native emulator with
# the NDK and CMake (libmain.so + libSDL3.so), then the Gradle project in
# android/ that packages it with SDL's Java glue. Each push to the android
# branch replaces the "android-latest" pre-release, so there is always one
# direct APK link to install.
on:
  push:
    branches: [ android ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: APK (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc ccache

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64

      - name: Configure native build
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK"
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSM2_BUILD_OPENGL_DESKTOP=OFF \
            -DSM2_BUILD_OPENGL_ES=ON \
            -DSM2_BUILD_VULKAN=OFF \
            -DSM2_SHADER_WERROR=OFF \
            -DSM2_EVDEV=OFF

      - name: Build native libraries
        run: cmake --build build-android --target keisho -- -k 0

      - name: Stage libraries and data
        run: |
          mkdir -p android/app/jniLibs/arm64-v8a android/app/assets
          find build-android -name 'libmain.so' -exec cp {} android/app/jniLibs/arm64-v8a/ \;
          find build-android -name 'libSDL3.so' -exec cp {} android/app/jniLibs/arm64-v8a/ \;
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded android/app/jniLibs/arm64-v8a/*.so
          ls -la android/app/jniLibs/arm64-v8a
          test -f android/app/jniLibs/arm64-v8a/libmain.so
          test -f android/app/jniLibs/arm64-v8a/libSDL3.so
          cp data/games.xml android/app/assets/
          cp -r data/lang android/app/assets/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          # The submodules carry their own sample wrappers; we use none of them.
          validate-wrappers: false

      - name: Build APK
        env:
          KEISHO_VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p android assembleRelease --stacktrace
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Keisho-android-arm64.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Keisho-android-arm64
          path: out/Keisho-android-arm64.apk

      - name: Publish android-latest pre-release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/Keisho-android-arm64.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Keisho Android (build ${{ github.run_number }})" \
            --notes "APK per Android TV e cellulare (arm64). Build automatica dal branch android, commit ${{ github.sha }}."
