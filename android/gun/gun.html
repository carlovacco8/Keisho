<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="M2 Pistola">
<meta name="theme-color" content="#111317">
<title>M2 NEXUS · Pistola</title>
<style>
  :root { --bg:#111317; --bar:#1a1d23; --edge:#2c313a; --orange:#e8a33a; --dim:#80858e; --red:#d9443a; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
      -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:#fff; overflow:hidden;
      font:600 16px/1.3 -apple-system, system-ui, sans-serif; touch-action:none; }
  body { display:flex; flex-direction:column; padding:env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
  .logo { color:var(--orange); font-size:20px; letter-spacing:.5px; }
  #status { font-size:13px; color:var(--dim); display:flex; align-items:center; gap:8px; }
  #dot { width:10px; height:10px; border-radius:50%; background:var(--red); }
  #dot.on { background:#3ccf6e; }
  .row { display:flex; gap:10px; padding:0 12px 10px; }
  .btn { flex:1; border:1px solid var(--edge); background:var(--bar); color:#fff; border-radius:16px;
      padding:16px 8px; text-align:center; font-size:17px; }
  .btn.down { background:#2c313a; }
  #fire { flex:1; margin:0 12px 12px; border-radius:28px; border:2px solid var(--orange);
      background:radial-gradient(circle at 50% 45%, #3a2a12, #1a1d23 70%); display:flex; align-items:center;
      justify-content:center; flex-direction:column; color:var(--orange); font-size:30px; letter-spacing:2px; }
  #fire.down { background:radial-gradient(circle at 50% 45%, #e8a33a, #7a5317 75%); color:#111; }
  #fire small { font-size:13px; color:var(--dim); letter-spacing:0; margin-top:8px; }
  #fire.down small { color:#222; }
  .sens { display:flex; align-items:center; gap:10px; padding:0 16px 12px; color:var(--dim); font-size:13px; }
  .sens input { flex:1; accent-color:var(--orange); }
  #pad { position:relative; height:90px; margin:0 12px 10px; border-radius:16px; background:#0b0c0f;
      border:1px solid var(--edge); overflow:hidden; }
  #pad .frame { position:absolute; left:50%; top:50%; width:104px; height:78px; transform:translate(-50%,-50%);
      border:1px solid var(--edge); }
  #cross { position:absolute; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%;
      border:2px solid var(--orange); left:50%; top:50%; }
  #start { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center;
      justify-content:center; padding:28px; text-align:center; gap:18px; z-index:5; }
  #start h1 { color:var(--orange); margin:0; font-size:28px; }
  #start p { color:#c8ccd3; margin:0; font-weight:500; max-width:420px; }
  #go { border:0; background:var(--orange); color:#111; font:700 20px -apple-system, system-ui, sans-serif;
      padding:18px 34px; border-radius:40px; }
  #err { color:var(--red); font-weight:500; }
</style>
</head>
<body>
<div id="start">
  <h1>Pistola M2 NEXUS</h1>
  <p>Tieni il telefono come un telecomando, con la parte alta puntata verso la TV.
     Il pollice preme <b>FUOCO</b>. Punta al centro dello schermo e premi <b>RICENTRA</b> quando il mirino si sposta.</p>
  <button id="go">TOCCA PER INIZIARE</button>
  <p id="err"></p>
</div>

<header>
  <div class="logo">M2 NEXUS</div>
  <div id="status"><span id="dot"></span><span id="stext">Non collegato</span></div>
</header>
<div id="pad"><div class="frame"></div><div id="cross"></div></div>
<div class="sens"><span>Sensibilità</span><input id="sens" type="range" min="18" max="70" step="1" value="38"><span id="sval"></span></div>
<div class="row">
  <div class="btn" id="reload">RICARICA</div>
  <div class="btn" id="recenter">RICENTRA</div>
</div>
<div id="fire">FUOCO<small>tieni premuto per sparare a raffica</small></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const store = (() => { try { return window.localStorage; } catch (e) { return null; } })();
  const load = (k, d) => { try { const v = store && store.getItem(k); return v === null || v === undefined ? d : v; } catch (e) { return d; } };
  const save = (k, v) => { try { store && store.setItem(k, v); } catch (e) {} };

  // ---- state -------------------------------------------------------------
  let yaw = 0, pitch = 0, haveAngles = false;    // where the top edge points, degrees
  let refYaw = null, refPitch = 0;                // the centre of the screen
  let sx = 0.5, sy = 0.5;                         // smoothed aim, fractions of the picture
  let buttons = 0;                                // 1 fire, 2 reload
  let span = parseFloat(load('m2gun.span', '38')); // degrees the picture is wide

  const sens = $('sens');
  sens.value = String(span);
  const showSpan = () => { $('sval').textContent = Math.round(span) + '°'; };
  showSpan();
  sens.addEventListener('input', () => { span = parseFloat(sens.value); save('m2gun.span', String(span)); showSpan(); });

  const wrap = (a) => { while (a > 180) a -= 360; while (a < -180) a += 360; return a; };

  // deviceorientation: the top edge's direction is (-cosB sinA, cosA cosB, sinB)
  // in the world frame, so its heading is -alpha and its elevation beta; the
  // roll (gamma) does not move the aim.
  function onOrientation(e) {
    if (e.alpha === null || e.beta === null) return;
    const a = e.alpha * Math.PI / 180, b = e.beta * Math.PI / 180;
    const vx = -Math.cos(b) * Math.sin(a), vy = Math.cos(a) * Math.cos(b), vz = Math.sin(b);
    yaw   = Math.atan2(vx, vy) * 180 / Math.PI;
    pitch = Math.asin(Math.max(-1, Math.min(1, vz))) * 180 / Math.PI;
    haveAngles = true;
    if (refYaw === null) { refYaw = yaw; refPitch = pitch; }
    update();
  }

  function update() {
    const dx = wrap(yaw - refYaw), dy = pitch - refPitch;
    const tx = 0.5 + dx / span;
    const ty = 0.5 - dy / (span * 0.75);
    // Light smoothing: steadier when still, quick when swung.
    const d = Math.hypot(tx - sx, ty - sy);
    const k = Math.min(1, 0.35 + d * 6);
    sx += (tx - sx) * k;
    sy += (ty - sy) * k;
    const cross = $('cross');
    cross.style.left = 'calc(50% + ' + ((Math.max(-0.2, Math.min(1.2, sx)) - 0.5) * 104).toFixed(1) + 'px)';
    cross.style.top  = 'calc(50% + ' + ((Math.max(-0.2, Math.min(1.2, sy)) - 0.5) * 78).toFixed(1) + 'px)';
    send();
  }

  // ---- connection: WebSocket, else HTTPS POSTs ---------------------------
  let ws = null, mode = 'none', lastSent = 0, posting = false, pending = false;
  const packet = () => {
    const buf = new ArrayBuffer(9), v = new DataView(buf);
    v.setFloat32(0, sx, true);
    v.setFloat32(4, sy, true);
    v.setUint8(8, buttons);
    return buf;
  };
  function setStatus(on, text) { $('dot').className = on ? 'on' : ''; $('stext').textContent = text; }

  function send() {
    lastSent = performance.now();
    if (mode === 'ws' && ws && ws.readyState === 1) { ws.send(packet()); return; }
    if (mode === 'post') postSoon();
  }
  function postSoon() {
    if (posting) { pending = true; return; }
    posting = true;
    fetch('/aim', { method: 'POST', body: packet(), cache: 'no-store', keepalive: false })
      .then(() => setStatus(true, 'Collegato'))
      .catch(() => setStatus(false, 'Non collegato'))
      .finally(() => { posting = false; if (pending) { pending = false; postSoon(); } });
  }

  function connect() {
    let opened = false;
    try {
      ws = new WebSocket('wss://' + location.host + '/ws');
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => { opened = true; mode = 'ws'; setStatus(true, 'Collegato'); send(); };
      ws.onclose = () => {
        if (opened) { setStatus(false, 'Riconnessione…'); mode = 'none'; setTimeout(connect, 1000); }
        else { mode = 'post'; send(); }
      };
      ws.onerror = () => {};
    } catch (e) { mode = 'post'; send(); }
    // Safari can refuse a WebSocket to a self-signed address: fall back.
    setTimeout(() => { if (!opened && mode !== 'post') { mode = 'post'; try { ws.close(); } catch (e) {} send(); } }, 2500);
  }
  // Keep the Shield knowing the phone is there even when it is held still.
  setInterval(() => { if (performance.now() - lastSent > 200) send(); }, 100);

  // ---- buttons -------------------------------------------------------------
  function hold(el, bit) {
    const down = (e) => { e.preventDefault(); el.classList.add('down'); buttons |= bit; send(); };
    const up   = (e) => { e.preventDefault(); el.classList.remove('down'); buttons &= ~bit; send(); };
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', up, { passive: false });
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
  }
  hold($('fire'), 1);
  hold($('reload'), 2);
  const recentre = (e) => {
    e.preventDefault();
    if (haveAngles) { refYaw = yaw; refPitch = pitch; sx = 0.5; sy = 0.5; update(); }
    $('recenter').classList.add('down');
    setTimeout(() => $('recenter').classList.remove('down'), 150);
  };
  $('recenter').addEventListener('touchstart', recentre, { passive: false });
  $('recenter').addEventListener('mousedown', recentre);
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  // ---- screen awake ----------------------------------------------------------
  let lock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') lock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', keepAwake);

  // ---- start -------------------------------------------------------------------
  $('go').addEventListener('click', async () => {
    const err = $('err');
    if (!window.isSecureContext) {
      err.textContent = 'Apri l’indirizzo che inizia con https:// mostrato sulla Shield e accetta l’avviso di Safari.';
      return;
    }
    if (typeof DeviceOrientationEvent === 'undefined') {
      err.textContent = 'Questo browser non dà accesso ai sensori di movimento.';
      return;
    }
    try {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') {
          err.textContent = 'Serve il permesso per i sensori di movimento. Chiudi e riapri la pagina, poi tocca “Consenti”.';
          return;
        }
      }
    } catch (e) {
      err.textContent = 'Permesso sensori non disponibile: ' + e;
      return;
    }
    window.addEventListener('deviceorientation', onOrientation);
    $('start').style.display = 'none';
    keepAwake();
    connect();
    setTimeout(() => { if (!haveAngles) setStatus(mode !== 'none', 'Nessun dato dai sensori'); }, 2000);
  });
})();
</script>
</body>
</html>
